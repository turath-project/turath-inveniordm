resource-types:
  pid-type: rsty
  data-file: vocabularies/resource_types.yaml
subjects:
  pid-type: sub
  schemes:
    - id: FOS
      name: Fields of Science and Technology
      uri: "http://www.oecd.org/science/inno/38235147.pdf"
      data-file: vocabularies/subjects_oecd_fos.yaml

# Custom vocabularies for Turath
resourcetypes:
  pid-type: rsct
  data-file: vocabularies/resource_types.yaml

places:
  pid-type: plc
  data-file: vocabularies/places.yaml

relationtypes:
  pid-type: rlt
  data-file: vocabularies/relation_types.yaml

# Uncomment and modify existing vocabularies as needed
creators:
  pid-type: crt
  data-file: vocabularies/creators.yaml

licenses:
  pid-type: lic
  data-file: vocabularies/cc_licences.csv

languages:
  pid-type: lng
  data-file: vocabularies/languages.yaml

