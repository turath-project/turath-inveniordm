# Cantaloupe configuration file with HTTPS enabled

# Basic settings
temp_pathname = /tmp
http.enabled = true
http.host = 0.0.0.0
http.port = 8182
https.enabled = true
https.host = 0.0.0.0
https.port = 8183
https.key_store_type = JKS
https.key_store_password = changeit
https.key_store_path = /opt/cantaloupe/ssl/cantaloupe.keystore
https.key_password = changeit

# Endpoint control
endpoint.iiif.content_disposition = inline
endpoint.iiif.min_size = 64
endpoint.iiif.max_size = 4000
endpoint.api.enabled = true
endpoint.api.username = admin
endpoint.api.secret = admin-secret

# Source settings
source.static = FilesystemSource
FilesystemSource.BasicLookupStrategy.path_prefix = /opt/cantaloupe/images/
FilesystemSource.BasicLookupStrategy.path_suffix =

# Processing
processor.pdf = PdfBoxProcessor
processor.fallback = Java2dProcessor
processor.normalize = false
processor.background_color = black
processor.upscale = true
processor.metadata.preserve = false

# Caching
cache.server.source = FilesystemCache
cache.server.source.ttl_seconds = 2592000
cache.server.derivative = FilesystemCache
cache.server.derivative.ttl_seconds = 2592000
FilesystemCache.pathname = /tmp/cantaloupe-cache

# CORS configuration for allowing access from all domains
cors.enabled = true
cors.allowed_origins = *
cors.allowed_methods = GET, OPTIONS, HEAD
cors.max_age = 86400
cors.allow_credentials = true

# Logging
log.application.level = WARN
log.application.ConsoleAppender.enabled = true
log.application.FileAppender.enabled = true
log.application.FileAppender.pathname = /var/log/cantaloupe/cantaloupe.log
log.application.RollingFileAppender.enabled = false
log.access.FileAppender.pathname = /var/log/cantaloupe/access.log 