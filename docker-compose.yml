# Backend services needed for development.
#
# This file will start all the backend services needed to run InvenioRDM
# locally in development mode.
#
# Usage::
#
#   $ docker-compose up -d
#
# Following services are included:
# - Cache: Redis (exposed port: 6379)
# - DB: (PostgresSQL/MySQL) (exposed port: 5432 or 3306)
# - Message queue: RabbitMQ (exposed ports: 5672, 15672)
# - Elasticsearch (exposed ports: 9200, 9300)
# - Kibana (view ES indexes) (exposed ports: 5601)
#
version: '2.2'
services:
  frontend:
    build: ./docker/nginx/             # Copied from docker-services.yml
    image: turath-inveniordm-frontend  # Copied from docker-services.yml
    restart: "unless-stopped"          # Copied from docker-services.yml
    ports:                             # Ensure fixed ports
      - "80:80"
      - "443:443"
    volumes:                           # Ensure volume mount is present
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  cache:
    extends:
      file: docker-services.yml
      service: cache
  db:
    extends:
      file: docker-services.yml
      service: db
  mq:
    extends:
      file: docker-services.yml
      service: mq
  search:
    extends:
      file: docker-services.yml
      service: search
  opensearch-dashboards:
    extends:
      file: docker-services.yml
      service: opensearch-dashboards
  pgadmin:
    extends:
      file: docker-services.yml
      service: pgadmin
  s3:
    extends:
      file: docker-services.yml
      service: s3
  iipserver:
    extends:
      file: docker-services.yml
      service: iipserver
    volumes:
      - image_tiles:/images/public
  cantaloupe:
    image: edirom/cantaloupe
    platform: linux/amd64  # Important for M1/M2 Mac
    restart: "unless-stopped"
    ports:
      - "8182:8182"
    environment:
      - CANTALOUPE_ENDPOINT_ADMIN_ENABLED=true
      - CANTALOUPE_ENDPOINT_ADMIN_SECRET=your_secret_here
      - CANTALOUPE_FILESYSTEM_RESOLVER_LOOKUP_STRATEGY_PATH_PREFIX=/opt/cantaloupe/images
    volumes:
      - ./test-images:/opt/cantaloupe/images

  # Turath Annotation Service (HOCR-based)
  annotation-service:
    build:
      context: ./services/annotation_service
    restart: "unless-stopped"
    ports:
      # Map container port 5002 to host port 5002 (accessible only locally)
      - "127.0.0.1:5002:5002"
    volumes:
      # Mount the host directory specified by the user to the data path inside the container
      - ./hocr_mount:/hocr_data # Assumes ./hocr_mount exists on the host
      # Optional: Mount local certs if USE_SSL=true
      # - ./certs:/app/certs
    environment:
      - FLASK_DEBUG=1 # Enable debug mode for development
      - PORT=5002
      - HOCR_BASE_DIR=/hocr_data/books
      - ANNOTATION_SERVICE_BASE_URL=http://annotation-service:5002
      - IIIF_SERVER_BASE_URL=http://nginx:80 # Assumes nginx proxies the IIIF Presentation API
      - USE_SSL=false
      # Define allowed origins for CORS (adjust as needed)
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000,http://127.0.0.1:5000
    expose:
      - 5002 # Expose port internally

  # Turath Search Service (HOCR-based)
  search-service:
    build:
      context: ./services/search_service
    restart: "unless-stopped"
    ports:
      # Map container port 5001 to host port 5001 (accessible only locally)
      - "127.0.0.1:5001:5001"
    volumes:
      # Mount the host directory specified by the user to the data path inside the container
      - ./hocr_mount:/hocr_data # Assumes ./hocr_mount exists on the host
      # Optional: Mount local certs if USE_SSL=true
      # - ./certs:/app/certs
    environment:
      - FLASK_DEBUG=1 # Enable debug mode for development
      - PORT=5001
      - HOCR_BASE_DIR=/hocr_data/books
      - SEARCH_SERVICE_BASE_URL=http://search-service:5001
      - IIIF_SERVER_BASE_URL=http://nginx:80 # Assumes nginx proxies the IIIF Presentation API
      - USE_SSL=false
      # Define allowed origins for CORS (adjust as needed)
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000,http://127.0.0.1:5000
    expose:
      - 5001 # Expose port internally

volumes:
  data:
  images:
  image_tiles:
  # hocr-data: {} # Replaced by bind mount from host directory

